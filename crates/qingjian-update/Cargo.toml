[package]
name = "qingjian-update"
description = "检查更新：读官网的 releases.json、验 ed25519 签名、按平台与渠道挑出比当前新的版本"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
qingjian-platform.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# TLS 后端按目标选：桌面保持 native-tls，其余目标走 rustls（Android 上没有 OpenSSL）。
# system-proxy 在 reqwest 0.13 属于 default，这里 default-features = false 已关掉，必须显式保留。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls", "system-proxy"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
reqwest = { workspace = true, features = ["rustls", "system-proxy"] }
