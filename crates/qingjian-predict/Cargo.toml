[package]
name = "qingjian-predict"
description = "云联想：OpenAI 兼容接口的候选词、整句补全、问字、翻译与释义兜底"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
qingjian-core.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# TLS 后端按目标选：桌面（Windows/macOS）保持 native-tls，其余目标走 rustls。
# Android 没有 OpenSSL，native-tls 会把 openssl-sys 拉进交叉编译。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
async-openai = { workspace = true, features = ["native-tls"] }
reqwest = { workspace = true, features = ["native-tls"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
async-openai = { workspace = true, features = ["rustls"] }
reqwest = { workspace = true, features = ["rustls"] }
