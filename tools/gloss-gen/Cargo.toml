[package]
name = "qingjian-gloss-gen"
description = "用 LLM 批量生成释义表与多音字读音标注"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
dotenvy.workspace = true
qingjian-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

# TLS 后端按目标选：桌面保持 native-tls，其余目标走 rustls。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
async-openai = { workspace = true, features = ["native-tls"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
async-openai = { workspace = true, features = ["rustls"] }
